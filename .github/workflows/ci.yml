name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-accessibility:
    name: Unit tests + Accessibility audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install accessibility testing dependencies
        run: npm install --save-dev vitest-axe axe-core --legacy-peer-deps

      - name: Type check
        run: npm run type-check || npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests with accessibility audits
        run: npx vitest run --reporter=verbose --reporter=json --outputFile=test-results/results.json
        env:
          CI: true

      - name: Upload test results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/test-results/
          retention-days: 14

      - name: Check for critical accessibility violations
        if: always()
        run: |
          if [ -f test-results/results.json ]; then
            echo "Checking for critical accessibility violations..."
            if grep -q "\"numFailedTests\":[1-9]" test-results/results.json; then
              echo "❌ Tests failed - including accessibility tests"
              exit 1
            fi
            echo "✅ All tests passed"
          fi

