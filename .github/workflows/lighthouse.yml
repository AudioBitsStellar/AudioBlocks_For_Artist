name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9/api
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9/api
      NEXT_PUBLIC_PRIVY_APP_ID: cl00000000000000000000000
      NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Next.js application
        run: npm run build

      - name: Prepare standalone assets
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

      - name: Check production JavaScript budgets
        run: npm run perf:budgets

      - name: Run Lighthouse CI
        run: CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")" npm run lighthouse

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: app/.lighthouseci/
          retention-days: 7
