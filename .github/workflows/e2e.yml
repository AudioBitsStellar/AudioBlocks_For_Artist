name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Public config the app validates at boot; specs mock every backend call,
      # so the API URL only needs to be valid and fail fast.
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9/api
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9/api
      NEXT_PUBLIC_PRIVY_APP_ID: cl00000000000000000000000
      NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build

      - name: Prepare standalone assets
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Run dashboard INP performance test
        run: npm run test:e2e -- --project=performance
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
