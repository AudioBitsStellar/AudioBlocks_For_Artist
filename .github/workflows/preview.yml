name: Deploy PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# One preview per open PR: a new push replaces the deployment instead of
# queuing a second one behind it.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# `pull-requests: write` lets the Vercel action comment the preview URL back on
# the PR; the job summary mirrors it so the link is also on the run page.
# See docs/adr/0005-pr-preview-deployments.md for why this triggers on
# `pull_request` and skips forks instead of using `pull_request_target`.
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: Vercel preview
    runs-on: ubuntu-latest

    # Actions cannot read repository secrets from a fork, so running here would
    # just fail on an empty VERCEL_TOKEN. Draft PRs are skipped for the same
    # reason as CI: nothing is ready to look at yet.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        # `--legacy-peer-deps` matches ci.yml: without it `npm ci` fails on the
        # @sentry/nextjs ↔ next peer conflict.
        run: npm ci --legacy-peer-deps
        working-directory: app

      - name: Deploy preview to Vercel
        id: vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: app
          github-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the preview URL
        if: always() && steps.vercel.outputs.preview-url != ''
        run: |
          {
            echo "### Artist portal preview"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| PR | #${{ github.event.pull_request.number }} |"
            echo "| Preview | ${{ steps.vercel.outputs.preview-url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
